<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .card{
            width:450px;
            padding:30px;
            border-radius:20px;
            backdrop-filter:blur(10px);
            background:rgba(255,255,255,0.15);
            color:white;
            box-shadow:0 8px 32px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        input,select{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#00e676;
            color:black;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

        p{
            text-align:center;
            margin-top:10px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>📄 AI Resume Analyzer</h1>

    <p>Upload your resume and get instant analysis</p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" required>

        <select name="role">

            <option>Python Developer</option>
            <option>Data Analyst</option>
            <option>Backend Engineer</option>

        </select>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>
</html>
