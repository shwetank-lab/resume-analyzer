<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Segoe UI, sans-serif;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
}

.progress{
    width:100%;
    height:30px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.bar{
    height:100%;
    background:#22c55e;
    text-align:center;
    color:white;
    line-height:30px;
}

.skill{
    display:inline-block;
    background:#22c55e;
    padding:8px 15px;
    border-radius:20px;
    margin:5px;
}

.missing{
    display:inline-block;
    background:#ef4444;
    padding:8px 15px;
    border-radius:20px;
    margin:5px;
}

a{
    color:white;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Resume Analysis Report</h1>

<h2>Target Role : {{ role }}</h2>

<h2>Resume Score : {{ score }}%</h2>

<div class="progress">
    <div class="bar" style="width: {{ score }}%;">
        {{ score }}%
    </div>
</div>

<h3>Detected Skills</h3>

{% for skill in found %}
<span class="skill">{{ skill }}</span>
{% endfor %}

<br><br>

<h3>Missing Skills</h3>

{% for skill in missing %}
<span class="missing">{{ skill }}</span>
{% endfor %}

<br><br>

<a href="/">Analyze Another Resume</a>

</div>

</div>

</body>
</html>
